plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'eclipse'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archives_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'META-INF/mods.toml'
}

repositories {
    mavenCentral()
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        name = "CreateMod"
        url = "https://maven.createmod.net"
        content {
            includeGroup "com.simibubi.create"
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
        }
    }
    maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/maven"
        content {
            includeGroup "org.spongepowered"
        }
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.env.disableRefMap', 'true'
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'mixin.env.disableRefMap', 'true'
        }

        data {
            data()
            gameDirectory = project.file('run')
            systemProperty 'mixin.env.disableRefMap', 'true'
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    devMods
}

// Copies mods that must load from a real mods folder (see devMods below) into the dev run.
tasks.register('copyDevMods', Copy) {
    from configurations.devMods
    into file('run/mods')
}
tasks.matching { it.name == 'prepareClientRun' }.configureEach { dependsOn 'copyDevMods' }

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    compileOnly "maven.modrinth:geckolib:${geckolib_version}"
    compileOnly "curse.maven:framework-549225:7530361"
    // Optional integration APIs are compile-only; runtime dependencies remain external.
    compileOnly "maven.modrinth:curios:${curios_version}"
    compileOnly "curse.maven:controllable-317269:${controllable_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // Create (hard dependency): ammo boxes are Create packages.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}") { transitive = false }

    // Dev runtime dependencies are required for local smoke testing but are not bundled.
    localRuntime "maven.modrinth:geckolib:${geckolib_version}"
    localRuntime "curse.maven:framework-549225:7530361"
    localRuntime "maven.modrinth:curios:${curios_version}"
    localRuntime "maven.modrinth:sound-physics-remastered:${sound_physics_remastered_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    localRuntime("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    localRuntime("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    localRuntime("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") { transitive = false }
    // Dev-run only (owner's modpack set): Modrinth version ids for MC 1.21.1 NeoForge.
    // Sodium ships as a jar-in-jar wrapper that the dev classpath can't unpack, so it and Iris go into run/mods.
    devMods("maven.modrinth:sodium:uMOpc5uV") { transitive = false }                    // 0.8.13
    devMods("maven.modrinth:iris:KduFYu4t") { transitive = false }                      // 1.8.14-beta.1, for Complementary
    localRuntime("maven.modrinth:colorwheel:8rq5KP4U") { transitive = false }           // 1.3.0
    localRuntime("maven.modrinth:farmers-delight:XTVZDOol") { transitive = false }      // 1.3.4
    localRuntime("maven.modrinth:create-dragons-plus:b0u9vk8C") { transitive = false }  // 1.11.9, needed by CEE
    localRuntime("maven.modrinth:create-enchantment-industry:L6VSDdC4") { transitive = false } // 2.5.4b
    localRuntime("maven.modrinth:platform:v7P0nBi2") { transitive = false }             // 1.3.3, needed by Vanilla Backport
    localRuntime("maven.modrinth:vanillabackport:rUSWdBok") { transitive = false }      // 1.1.7.10
    localRuntime("maven.modrinth:sable:fg9dTRz9") { transitive = false }                // 2.0.6, needed by Aeronautics
    localRuntime("maven.modrinth:create-aeronautics:44pLdPGg") { transitive = false }   // 1.3.2

    // Deferred optional mod integrations should stay external unless deliberately enabled.
}

def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_credits            : mod_credits,
        mod_description        : mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Scorched Guns",
                "Specification-Vendor"    : "ribs",
                "Specification-Version"   : "1",
                "Implementation-Title"    : "Scorched Guns",
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "ribs",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "scguns.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
